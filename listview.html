<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <title>Freshnececom</title>
</head>

<body>
    <!-- website header part  -->
    <header id="home">
        <div class="container">
            <div class="header__block">
                <!-- header top  -->
                <div class="header__top">
                    <div class="header__top-left">
                        <a href="#home" class="header__top-link">Chat with us</a>
                        <a href="tel:420 336 775 664" class="header__top-link  text-black">+420 336 775 664</a>
                        <a href="mailto:info@freshnesecom.com"
                            class="header__top-link  text-black">info@freshnesecom.com</a>
                    </div>
                    <div class="header__top-right">
                        <a href="#home" class="header__top-link">Blog</a>
                        <a href="#home" class="header__top-link">About Us</a>
                        <a href="#home" class="header__top-link">Careers</a>
                    </div>
                </div>
                <!-- header nav  -->
                <div class="header__nav">
                    <!-- logo  -->
                    <div class="header__logo">
                        <a href="index.html">
                            <img src="./imgs/brand-logo.svg" alt="Brand logo">
                        </a>
                    </div>
                    <!-- search and category  action-->
                    <div class="header__action">
                        <div class="header__action-category">
                            <span class="stick__man-text">All category</span>
                        </div>
                        <span class="stic__man-line"></span>
                        <div class="header__action-searchs">
                            <input type="search" placeholder="Search Products, categories ...">
                        </div>
                    </div>
                    <!-- header nav user menu  -->
                    <div class="header__nav-user">
                        <a class="stick__man-store" href="#home">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 21.9999L3.79 19.1199C6.4 9.6199 17.6 9.6199 20.21 19.1199L21 21.9999"
                                    stroke="#151515" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path
                                    d="M12 11.98C14.7614 11.98 17 9.74141 17 6.97998C17 4.21856 14.7614 1.97998 12 1.97998C9.23858 1.97998 7 4.21856 7 6.97998C7 9.74141 9.23858 11.98 12 11.98Z"
                                    stroke="#151515" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="bevel" />
                            </svg>
                        </a>
                        <a class="stick__man-store" href="#home">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M17.8896 20.8499H6.10955C5.79187 20.8501 5.48326 20.7439 5.23309 20.5481C4.98291 20.3523 4.80562 20.0783 4.72955 19.7699L2.07955 9.15986C2.05369 9.05657 2.05174 8.94874 2.07383 8.84458C2.09593 8.74042 2.1415 8.64267 2.20707 8.55878C2.27264 8.47489 2.35649 8.40706 2.45223 8.36046C2.54797 8.31386 2.65307 8.28971 2.75955 8.28986H21.2396C21.346 8.28971 21.4511 8.31386 21.5469 8.36046C21.6426 8.40706 21.7265 8.47489 21.792 8.55878C21.8576 8.64267 21.9032 8.74042 21.9253 8.84458C21.9474 8.94874 21.9454 9.05657 21.9196 9.15986L19.2696 19.7699C19.1935 20.0783 19.0162 20.3523 18.766 20.5481C18.5158 20.7439 18.2072 20.8501 17.8896 20.8499V20.8499Z"
                                    stroke="#151515" stroke-width="2.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M9.79941 3.14993L6.89941 8.28993" stroke="#151515" stroke-width="2.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M13.8799 3.14993L16.7899 8.28993" stroke="#151515" stroke-width="2.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </a>
                    </div>
                </div>
                <!-- header nav finished  -->
            </div>
        </div>
    </header>
    <!-- header part finished  -->

    <!-- main part started  -->
    <main>
        <!-- bar section started  -->
        <section class="bar">
            <div class="container">
                <!-- bar section wrapper  -->
                <div class="bar__block">
                    <ul class="bar__items">
                        <li class="bar__item-link"><a href="#home">Bakery</a></li>
                        <li class="bar__item-link"><a href="#home">Fruit and vegetables</a></li>
                        <li class="bar__item-link"><a href="#home">Meat and fish</a></li>
                        <li class="bar__item-link"><a href="#home">Drinks</a></li>
                        <li class="bar__item-link"><a href="#home">Kitchen</a></li>
                        <li class="bar__item-link"><a href="#home">Special nutrition</a></li>
                        <li class="bar__item-link"><a href="#home">Baby</a></li>
                        <li class="bar__item-link"><a href="#home">Pharmacy</a></li>
                    </ul>
                </div>
            </div>
        </section>

        <!-- page navigation  -->
        <section class="navigation">
            <div class="container">
                <div class="navigation__block">
                    <span class="navigation__text">Homepage /</span>
                    <span class="navigation__text-black">Fruit
                        and vegetables</span>
                </div>
            </div>
        </section>
        <!-- page navigation finished  -->
        <section class="products">
            <div class="container">
                <div class="products__block">
                    <div class="product__top-title">
                        <h2 class="product__top-text">Fruit and vegetables</h2>
                        <div class="product__layout">
                            <span class="product__layout-item">Grid view</span>
                            <span class="product__layout-item">List view</span>
                            <span class="product__layout-item">Products</span>
                        </div>
                    </div>
                    <div class="product__filter">
                        <div class="product__filter-text">
                            <input type="radio" id="radio" name="fav_language" value="HTML">
                              <label for="text">Filter text </label><br>
                            
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
